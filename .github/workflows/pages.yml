# Publie le site (dossier public/) sur GitHub Pages à chaque changement.
# Une fois Néophyte en ligne à neo-phyte.fr, mettre la variable du dépôt DEMENAGEMENT à « oui » :
# l'ancienne adresse ne publie plus que la redirection (dossier demenagement/), qui emporte la progression des testeurs.
name: Publier le site

on:
  push:
    branches: [main]
    paths: ["public/**", "tools/**", "demenagement/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # une question mal formée ou un calcul faux bloque la publication
      - name: Vérifier les banques d'exercices
        run: node tools/verifier-banques.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ vars.DEMENAGEMENT == 'oui' && 'demenagement' || 'public' }}
      - id: deployment
        uses: actions/deploy-pages@v4
